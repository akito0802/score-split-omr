name: Audiveris OMR
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Temporary signed URL of PDF/PNG/JPG
        required: true
        type: string
jobs:
  recognize:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download score preserving type
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl --fail --location --max-filesize 20971520 "$SOURCE_URL" -o input.bin
          MIME="$(file --brief --mime-type input.bin)"
          case "$MIME" in
            application/pdf) EXT=pdf ;;
            image/png) EXT=png ;;
            image/jpeg) EXT=jpg ;;
            *) echo "Unsupported file type: $MIME"; exit 2 ;;
          esac
          mv input.bin "input.$EXT"
          echo "INPUT_FILE=input.$EXT" >> "$GITHUB_ENV"

      - name: Install Audiveris
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o audiveris.deb "https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb"
          sudo apt-get update
          sudo apt-get install -y ./audiveris.deb
          test -x /opt/audiveris/bin/Audiveris
          /opt/audiveris/bin/Audiveris -help >/dev/null

      - name: Recognize score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          /opt/audiveris/bin/Audiveris -batch -export -output out "$INPUT_FILE"
          find out -maxdepth 3 -type f -print

      - name: Upload MusicXML result
        uses: actions/upload-artifact@v4
        with:
          name: score-split-musicxml
          path: |
            out/**/*.mxl
            out/**/*.musicxml
            out/**/*.xml
          if-no-files-found: error
          retention-days: 1
