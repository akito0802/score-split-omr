name: Audiveris OMR
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Temporary signed URL of PDF/PNG/JPG
        required: true
        type: string

jobs:
  recognize:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout OMR helpers
        uses: actions/checkout@v4

      - name: Download score preserving type
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          curl --fail --location --max-filesize 20971520 "$SOURCE_URL" -o input.bin
          MIME="$(file --brief --mime-type input.bin)"
          case "$MIME" in
            application/pdf) EXT=pdf ;;
            image/png) EXT=png ;;
            image/jpeg) EXT=jpg ;;
            *) echo "Unsupported file type: $MIME"; exit 2 ;;
          esac
          mv input.bin "input.$EXT"
          echo "INPUT_FILE=input.$EXT" >> "$GITHUB_ENV"

      - name: Install Audiveris
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o audiveris.deb "https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb"
          sudo apt-get update

          # Audiveris' package post-install script calls xdg-desktop-menu.
          # GitHub-hosted runners are headless, so create a minimal writable
          # system menu tree before installing the package.
          sudo mkdir -p /usr/local/share/applications
          sudo mkdir -p /usr/local/share/desktop-directories
          sudo mkdir -p /etc/xdg/menus/applications-merged
          sudo mkdir -p /usr/share/desktop-directories
          sudo chmod 755 /usr/local/share/applications /usr/local/share/desktop-directories /etc/xdg/menus/applications-merged /usr/share/desktop-directories

          export XDG_DATA_DIRS="/usr/local/share:/usr/share"
          export XDG_CONFIG_DIRS="/etc/xdg"

          # Install payload. The desktop-menu postinst may still be unsuitable
          # for a headless runner; the Audiveris payload itself is what OMR needs.
          set +e
          sudo -E dpkg -i ./audiveris.deb
          DPKG_RC=$?
          set -e

          if [ ! -x /opt/audiveris/bin/Audiveris ]; then
            echo "Audiveris executable missing after package extraction (dpkg rc=$DPKG_RC)"
            exit 1
          fi

          echo "Audiveris installed; dpkg rc=$DPKG_RC"
          /opt/audiveris/bin/Audiveris -help >/dev/null

      - name: Prepare image for OMR
        if: ${{ env.INPUT_FILE != 'input.pdf' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y imagemagick tesseract-ocr
          WIDTH=$(identify -format '%w' "$INPUT_FILE")
          HEIGHT=$(identify -format '%h' "$INPUT_FILE")
          echo "Input image: ${WIDTH}x${HEIGHT}"

          # Create an OMR-oriented copy: enlarge, flatten transparency,
          # grayscale, normalize contrast and binarize local staff details.
          LONGEST=$(( WIDTH > HEIGHT ? WIDTH : HEIGHT ))
          if [ "$LONGEST" -lt 5000 ]; then
            SCALE_PERCENT=$(( (5000 * 100 + LONGEST - 1) / LONGEST ))
          else
            SCALE_PERCENT=100
          fi

          convert "$INPUT_FILE" \
            -background white -alpha remove -alpha off \
            -filter Lanczos -resize "${SCALE_PERCENT}%" \
            -colorspace Gray \
            -auto-level \
            -contrast-stretch 0.5%x0.5% \
            -sharpen 0x1 \
            -threshold 72% \
            -type bilevel \
            -units PixelsPerInch -density 300 \
            prepared.png

          INPUT_FILE="prepared.png"
          echo "INPUT_FILE=$INPUT_FILE" >> "$GITHUB_ENV"
          identify "$INPUT_FILE"

      - name: Read printed chord symbols
        if: ${{ env.INPUT_FILE != 'input.pdf' }}
        shell: bash
        run: |
          set -euo pipefail
          # OCR the original-resolution/upscaled page. TSV preserves positions.
          # Whitelist keeps recognition focused on common chord-symbol characters.
          tesseract prepared.png stdout --psm 11 -l eng \
            -c tessedit_char_whitelist='ABCDEFG#b/0123456789majindugsM' tsv > chords.tsv || true
          echo "Chord OCR candidates:"
          awk -F '\t' 'NR>1 && $12 != "" {print $7,$8,$9,$10,$12}' chords.tsv | head -100 || true

      - name: Recognize score
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          /opt/audiveris/bin/Audiveris -batch -export -output out "$INPUT_FILE"
          find out -maxdepth 3 -type f -print

      - name: Merge OCR chord symbols
        if: ${{ env.INPUT_FILE != 'input.pdf' }}
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(find out -type f \( -iname '*.mxl' -o -iname '*.musicxml' -o -iname '*.xml' \) | head -1)"
          if [ -n "$RESULT" ] && [ -s chords.tsv ]; then
            python3 merge_chords.py "$RESULT" chords.tsv || true
            MERGED="${RESULT%.*}.musicxml"
            if [ -s "$MERGED" ]; then
              cp "$MERGED" out/chord-merged.musicxml
            fi
          fi

      - name: Upload MusicXML result
        uses: actions/upload-artifact@v4
        with:
          name: score-split-musicxml
          path: |
            out/**/*.mxl
            out/**/*.musicxml
            out/**/*.xml
          if-no-files-found: error
          retention-days: 1
